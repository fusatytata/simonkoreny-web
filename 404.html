<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tady nic není – Šimon Kořený</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
:root{--paper:#F0EFEE;--ink:#000;--purple:#5F449A;--skin:#EAB275;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--purple);color:var(--paper);font:400 18px/1.5 "Bricolage Grotesque",Georgia,serif;display:flex;align-items:center;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:1180px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
h1{margin:0;font-size:clamp(64px,13vw,168px);line-height:.88;font-weight:800;letter-spacing:-.045em;text-wrap:balance}
p{margin:24px 0 0;font-size:22px;font-weight:600;max-width:30ch}
.row{margin-top:40px;display:flex;flex-wrap:wrap;gap:12px}
a{min-height:56px;padding:0 26px;border-radius:999px;display:inline-flex;align-items:center;font-weight:700;text-decoration:none}
.cv{background:var(--skin);color:var(--ink)}
.play{background:var(--ink);color:var(--paper)}
a:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>Tohle spadlo mimo koš.</h1>
<p>Stránka, kterou hledáš, tady není.</p>
<div class="row"><a class="cv" href="/cv/">Do CV</a><a class="play" href="/hra/">Zahrát si</a></div>
</main>
</body>
</html>
